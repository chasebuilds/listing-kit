description: |
  A brick colonial on a deep, tree-lined lot. The two-story foyer opens to a formal dining room, a study with built-in shelves and a family room with a gas fireplace that flows into the eat-in kitchen.

  The kitchen has white cabinets, a six-burner range, a double oven and a pantry closet. Upstairs, the primary suite has a sitting area, two closets and a bath with a double vanity and a separate shower. Three more bedrooms and two baths complete the second floor.

  The finished lower level has a recreation room, a guest bedroom with a full bath and a utility room with a workbench. A two-car attached garage, a screened porch and a paver patio finish the back of the house. Monthly HOA dues cover snow removal and common areas.
