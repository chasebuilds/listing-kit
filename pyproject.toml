[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-kit"
version = "1.1.0"
description = "One YAML file to a fast single-property listing website, plus a fair-housing wording checker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chase Builds" }]
dependencies = ["jinja2>=3.1", "pyyaml>=6", "jsonschema>=4.20", "pillow>=10", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
listing-kit = "listing_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
listing_kit = ["templates/*.j2", "themes/*.css", "static/*", "static/leaflet/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["listing_kit"]
