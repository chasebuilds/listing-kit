description: |
  A 1951 cottage on a quiet lane, six blocks from the waterfront. The front room has tall windows, a brick fireplace and original pine floors. The galley kitchen was updated in 2023 with new cabinets, a gas range and a pantry cupboard.

  Both bedrooms have double closets. The bath has a tiled tub and shower and a window that opens to the side yard. A screened porch at the back looks over a fenced garden with raised beds and a storage shed.

  The roof and water heater were replaced in 2022. An offer has been accepted and the sale is pending; the page stays up while the contract runs.
