description: |
  A 1926 craftsman bungalow with a deep covered porch, original wood trim and a bright open living and dining room. The updated kitchen has a gas range, quartz counters, an island with seating for three and a walk-in pantry.

  The primary bedroom sits at the back of the house with a walk-in closet and a tiled shower. Two more bedrooms share a hall bath with a soaking tub. A finished basement room works as an office, hobby room or extra storage.

  The fenced back yard has a deck, string lights and a mature maple. The home is on a quiet cul-de-sac, a short walk from the Maple Street park and a 10 minute drive to downtown.
